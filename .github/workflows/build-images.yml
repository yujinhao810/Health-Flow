name: Build production images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: apps/api/Dockerfile
          - image: web
            context: .
            dockerfile: apps/web/Dockerfile
          - image: document-parser
            context: services/document-parser
            dockerfile: services/document-parser/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image repository
        id: image-repository
        shell: bash
        env:
          CONFIGURED_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          CONFIGURED_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
        run: |
          registry="${CONFIGURED_REGISTRY:-ghcr.io}"
          namespace="${CONFIGURED_NAMESPACE:-$GITHUB_REPOSITORY}"
          echo "registry=${registry,,}" >> "$GITHUB_OUTPUT"
          echo "namespace=${namespace,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to image registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image-repository.outputs.registry }}
          username: ${{ steps.image-repository.outputs.registry == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ steps.image-repository.outputs.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image-repository.outputs.registry }}/${{ steps.image-repository.outputs.namespace }}-${{ matrix.image }}:latest
            ${{ steps.image-repository.outputs.registry }}/${{ steps.image-repository.outputs.namespace }}-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
